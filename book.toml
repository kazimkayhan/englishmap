[book]
authors = ["Kazim Kayhan"]
language = "en"
multilingual = false
src = "src"
title = "EnglishMap — English for Dari & Hazaragi Speakers"
description = "A comprehensive self-study English guide for Afghan learners — supporting Dari and Hazaragi speakers learning American English"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/kazimkayhan/englishmap"
edit-url-template = "https://github.com/kazimkayhan/englishmap/edit/main/{path}"
site-url = "/englishmap/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/custom.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
line-numbers = true

[output.html.print]
enable = true
